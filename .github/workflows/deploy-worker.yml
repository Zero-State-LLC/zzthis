# Deploy the /v1 Worker to Cloudflare (spec 005 FR-029).
#
# The Cloudflare credential lives in this repository, as the Actions secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, so any agent or maintainer
# can deploy the Worker from GitHub instead of one person's machine.
#
# The run is manual on purpose. This repo's AGENTS.md and the constitution
# (Principle VIII) say agents do not dispatch production deploys, so a person
# or an agent chooses when to run this, and every run is recorded in the
# Actions log. There is no push trigger.
#
# Needs, before the first run:
#   - the D1 database, the R2 bucket, and the Durable Object namespace created
#     (spec 005 T023), and database_id in workers/api/wrangler.toml filled in;
#   - the Worker secrets set (ZZ_DATA_KEY, ZZ_TOKEN_SECRET,
#     ZZ_RECORD_SIGNING_KEY) and the vars with no default (ZZ_ENV,
#     ZZ_WORDLIST_VERSION, ZZ_RECORD_SIGNING_KEY_ID).
name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      apply-migrations:
        description: Apply D1 migrations before the deploy
        type: boolean
        default: true

permissions:
  contents: read

# One deploy at a time, and never cancel one that is in flight.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Worker serves the web client from apps/web/dist ([assets] in
      # wrangler.toml), so build it before the deploy.
      - name: Build the web client
        run: npm run build -w apps/web

      - name: Apply D1 migrations
        if: inputs.apply-migrations
        working-directory: workers/api
        run: npx wrangler d1 migrations apply zzthis --remote

      - name: Deploy the Worker
        working-directory: workers/api
        run: npx wrangler deploy
