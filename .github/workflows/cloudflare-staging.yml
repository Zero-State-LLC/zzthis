name: Cloudflare marketing staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-marketing-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-staging
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: bash scripts/check-agents-md.sh AGENTS.md
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: ASTRO_BASE=/ npm run build
      - run: ./scripts/security-scan.sh
      - name: Dry-run marketing Worker
        run: npm exec --workspace @zzthis/api -- wrangler deploy --dry-run --config ../../wrangler.site.toml --outdir ../../.wrangler/site-dry-run
      - name: Deploy marketing Worker to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing staging CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing staging CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npm exec --workspace @zzthis/api -- wrangler deploy --config ../../wrangler.site.toml
      - name: Record deployment source
        run: |
          printf 'Marketing staging deployment source: `%s`\n\nWorker: `zzthis-site-staging`\n\nSee the preceding Wrangler output for the observed URL and deployment/version identifier. Route parity and rollback evidence remain required.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
