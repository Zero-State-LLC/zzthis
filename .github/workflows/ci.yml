name: CI

# Generic until the app stack lands. Node steps run only when package.json
# exists, so this passes on a docs-only tree and on a Next.js or Astro site.
# The job id stays `build`: that is the required check name on main.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Check AGENTS.md contract
      run: bash scripts/check-agents-md.sh AGENTS.md

    - name: Detect Node project
      id: detect
      run: |
        if [ -f package.json ]; then
          echo "node=true" >> "$GITHUB_OUTPUT"
          if [ -f pnpm-lock.yaml ]; then pm=pnpm
          elif [ -f yarn.lock ]; then pm=yarn
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then pm=bun
          else pm=npm; fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "package.json found; package manager: $pm"
        else
          echo "node=false" >> "$GITHUB_OUTPUT"
          echo "No package.json; skipping install, lint, and build."
        fi

    - name: Set up pnpm
      if: steps.detect.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@v4

    - name: Set up Bun
      if: steps.detect.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@v2

    - name: Set up Node
      if: steps.detect.outputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      if: steps.detect.outputs.node == 'true'
      run: |
        set -euo pipefail
        case "${{ steps.detect.outputs.pm }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) corepack enable && yarn install --immutable || yarn install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
          npm)  if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
        esac

    - name: Lint
      if: steps.detect.outputs.node == 'true'
      run: |
        if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
          ${{ steps.detect.outputs.pm }} run lint
        else
          echo "No lint script in package.json; skipping."
        fi

    - name: Build
      if: steps.detect.outputs.node == 'true'
      run: |
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          ${{ steps.detect.outputs.pm }} run build
        else
          echo "No build script in package.json; skipping."
        fi
