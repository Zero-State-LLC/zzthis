name: Cloudflare API staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-staging
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: bash scripts/check-agents-md.sh AGENTS.md
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: ASTRO_BASE=/ npm run build
      - run: ./scripts/security-scan.sh
      - name: Dry-run API Worker
        run: npm exec --workspace @zzthis/api -- wrangler deploy --dry-run --config wrangler.staging.toml --outdir .wrangler/api-staging-dry-run
        working-directory: workers/api
      - name: Deploy API Worker to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing staging CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing staging CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npm exec --workspace @zzthis/api -- wrangler d1 migrations apply zzthis-staging --remote --config wrangler.staging.toml
          npm exec --workspace @zzthis/api -- wrangler deploy --config wrangler.staging.toml
      - name: Record deployment source
        run: |
          printf 'API staging deployment source: `%s`\n\nWorker: `zzthis-api-staging`\n\nVerify settings readiness, the staging D1/R2 bindings, and rollback evidence before any promotion.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
