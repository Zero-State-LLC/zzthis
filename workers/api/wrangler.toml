# The zzThis Worker: the /v1 API and the web client's files on one origin
# (spec 005 FR-029, plan.md Repo layout).
#
# Base/local contract. Remote staging/production resource identifiers are operator-managed and must be supplied through an approved environment-specific configuration before deploy. Do not replace placeholders on a feature branch with production ids. Local runs/tests use local state only.
# The default config is local-only; remote environments use explicit configs.
# Keep this name distinct from the human-gated production Worker `zzthis-api`.
name = "zzthis-api-local"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# spec 005 Security headers: every request reaches the Worker first, so one
# mechanism adds the headers to every asset response.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
run_worker_first = true

# RM-036: the deployed version id, for the log line.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "ZZ_DB"
database_name = "zzthis-local-placeholder"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ZZ_PHOTOS"
bucket_name = "zzthis-photos-local-placeholder"

[[durable_objects.bindings]]
name = "ZZ_LIMITER"
class_name = "Limiter"

# A SQLite-backed Durable Object needs no paid plan (spec 005 plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# FR-026: the daily retention run.
[triggers]
crons = ["17 3 * * *"]

# Vars with safe defaults only (spec 005 Environment). ZZ_ENV,
# ZZ_WORDLIST_VERSION, ZZ_RECORD_SIGNING_KEY_ID, and every secret have no
# default, so a deploy that omits one fails closed with 503 not-ready.
[vars]
ZZ_CONTRACT = "1"
ZZ_FREE_PUBLIC = "false"
ZZ_MINT_ENABLED = "false"
ZZ_PHOTO_READS = "false"
ZZ_DEV_AUTH = "false"
