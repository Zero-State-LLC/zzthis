# The zzThis Worker: the /v1 API and the web client's files on one origin
# (spec 005 FR-029, plan.md Repo layout).
#
# No Cloudflare resource exists for this Worker. The D1 database, the R2
# bucket, the Durable Object namespace, the cron, and the secrets are created
# at deploy time, with Danny's yes (spec 005 T023). Local runs and tests use
# local state only, so the database id below is a placeholder that fails a
# deploy until a person replaces it.
name = "zzthis-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# spec 005 Security headers: every request reaches the Worker first, so one
# mechanism adds the headers to every asset response.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "ZZ_DB"
database_name = "zzthis"
database_id = "set-at-deploy"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ZZ_PHOTOS"
bucket_name = "zzthis-photos"

[[durable_objects.bindings]]
name = "ZZ_LIMITER"
class_name = "Limiter"

# A SQLite-backed Durable Object needs no paid plan (spec 005 plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# FR-026: the daily retention run.
[triggers]
crons = ["17 3 * * *"]

# Vars with safe defaults only (spec 005 Environment). ZZ_ENV,
# ZZ_WORDLIST_VERSION, ZZ_RECORD_SIGNING_KEY_ID, and every secret have no
# default, so a deploy that omits one fails closed with 503 not-ready.
[vars]
ZZ_CONTRACT = "1"
ZZ_FREE_PUBLIC = "false"
ZZ_MINT_ENABLED = "false"
ZZ_PHOTO_READS = "false"
ZZ_DEV_AUTH = "false"
